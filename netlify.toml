# The website (site/), built by scripts/build-site.sh and hosted on Netlify.

[build]
  command = "scripts/build-site.sh"
  publish = "build/site"
  # Build only when something the site uses changed (pages, screenshots, or a release in appcast.xml).
  # (A first build, with no earlier commit to compare, always runs.)
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site docs/images appcast.xml scripts/build-site.sh netlify.toml"

# The download buttons: always the newest release's disk image, with no version in the link.
[[redirects]]
  from = "/download"
  to = "https://github.com/ijahongirmirzo/pulli/releases/latest/download/Pulli.dmg"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
