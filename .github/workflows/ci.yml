# Builds the vendored libraries and the Swift packages, and runs the tests, on every push and
# pull request. Needs a runner with Xcode for macOS 26. Changes that only touch the website
# (site/ and its build script) skip it; Cloudflare Pages builds those.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: [site/**, scripts/build-site.sh]
  pull_request:
    paths-ignore: [site/**, scripts/build-site.sh]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tools for building libusb and libmtp
        run: brew install autoconf automake libtool pkg-config
      - name: Cache the vendored libraries
        uses: actions/cache@v4
        with:
          path: Vendor/out
          key: vendor-${{ hashFiles('Vendor/versions.lock', 'Vendor/build-deps.sh', 'Vendor/patches/**') }}
      - name: Build libusb and libmtp
        run: |
          if [ ! -f Vendor/out/lib/libmtp.9.dylib ]; then Vendor/build-deps.sh; fi
      - name: Build
        run: swift build
      - name: Test
        # One test at a time: CI runners are slow, and a crash then names its test.
        run: swift test --no-parallel
      - name: Test FinderLocations package
        run: swift test --package-path Packages/FinderLocations
